<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
    <defs>
        <linearGradient id="bgAcct" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#001a33" />
            <stop offset="100%" stop-color="#004080" />
        </linearGradient>
    </defs>
    <rect width="100%" height="100%" fill="url(#bgAcct)" />
    
    <g transform="translate(150, 80)">
        <rect x="0" y="0" width="500" height="300" rx="8" fill="#ffffff" opacity="0.95" />
        
        <rect x="0" y="0" width="500" height="50" rx="8" fill="#0056b3" />
        <rect x="0" y="25" width="500" height="25" fill="#0056b3" />
        <text x="30" y="32" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="16">ASSETS</text>
        <text x="200" y="32" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="16">Q1</text>
        <text x="300" y="32" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="16">Q2</text>
        <text x="400" y="32" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="16">YTD</text>

        <path d="M 0 100 L 500 100" stroke="#e2e8f0" stroke-width="2" />
        <path d="M 0 150 L 500 150" stroke="#e2e8f0" stroke-width="2" />
        <path d="M 0 200 L 500 200" stroke="#e2e8f0" stroke-width="2" />
        <path d="M 0 250 L 500 250" stroke="#e2e8f0" stroke-width="2" />

        <path d="M 180 50 L 180 300" stroke="#e2e8f0" stroke-width="2" />
        <path d="M 280 50 L 280 300" stroke="#e2e8f0" stroke-width="2" />
        <path d="M 380 50 L 380 300" stroke="#e2e8f0" stroke-width="2" />

        <g font-family="monospace" font-size="14" fill="#334155">
            <text x="30" y="80" font-family="sans-serif">Cash &amp; Equiv</text>
