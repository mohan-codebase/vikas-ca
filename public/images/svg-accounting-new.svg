        <rect x="15" y="15" width="90" height="30" rx="4" fill="#c89d5c" />
        <text x="95" y="35" fill="#ffffff" font-family="monospace" font-size="16" text-anchor="end">966,300</text>
        
        <circle cx="30" cy="70" r="10" fill="#334155" />
        <circle cx="60" cy="70" r="10" fill="#334155" />
        <circle cx="90" cy="70" r="10" fill="#0099db" />

        <circle cx="30" cy="100" r="10" fill="#334155" />
        <circle cx="60" cy="100" r="10" fill="#334155" />
        <circle cx="90" cy="100" r="10" fill="#0099db" />

        <circle cx="30" cy="130" r="10" fill="#334155" />
        <circle cx="60" cy="130" r="10" fill="#334155" />
        <circle cx="90" cy="130" r="10" fill="#00a99d" />
