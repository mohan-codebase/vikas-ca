            <text x="300" y="80">$142,300</text>
            <text x="400" y="80" font-weight="bold" fill="#0099db">$266,800</text>

            <text x="30" y="130" font-family="sans-serif">Accounts Rec</text>
            <text x="200" y="130">$45,200</text>
            <text x="300" y="130">$51,800</text>
            <text x="400" y="130" font-weight="bold" fill="#0099db">$97,000</text>

            <text x="30" y="180" font-family="sans-serif">Inventory</text>
            <text x="200" y="180">$88,100</text>
            <text x="300" y="180">$79,400</text>
            <text x="400" y="180" font-weight="bold" fill="#0099db">$167,500</text>
            
            <text x="30" y="230" font-family="sans-serif">Investments</text>
            <text x="200" y="230">$210,000</text>
            <text x="300" y="230">$225,000</text>
            <text x="400" y="230" font-weight="bold" fill="#0099db">$435,000</text>

            <text x="30" y="280" font-family="sans-serif" font-weight="bold" fill="#0b1524">TOTAL ASSETS</text>
            <text x="200" y="280" font-weight="bold" fill="#0b1524">$467,800</text>
            <text x="300" y="280" font-weight="bold" fill="#0b1524">$498,500</text>
            <text x="400" y="280" font-weight="bold" fill="#00a99d">$966,300</text>
